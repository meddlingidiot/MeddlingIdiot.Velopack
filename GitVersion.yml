# GitVersion.yml
mode: ContinuousDelivery
assembly-versioning-scheme: MajorMinorPatch
tag-pre-release-weight: 60000
# 1.1.0 shipped with MeddlingIdiot.* namespaces; 1.2.0 puts them back to Automation.* to
# match the house convention. That is a breaking change for anyone who took 1.1.0 - which is
# Greenlight and CarsClient, both updated in step - so it gets a minor rather than a patch.
next-version: 1.2.0
tag-prefix: '[vV]?'
branches:
  main:
    mode: ContinuousDeployment
    increment: Patch
    # Removed label for stable releases (no pre-release suffix)
    regex: ^master$|^main$
    is-main-branch: true
    track-merge-target: false
  feature:
    mode: ContinuousDelivery
    label: beta
    increment: Patch
    regex: ^feature(s)?[/-]
    source-branches: ['main']
    is-main-branch: false
    pre-release-weight: 30000
  bugfix:
    mode: ContinuousDelivery
    label: beta
    increment: Patch
    regex: ^bugfix(es)?[/-]
    source-branches: ['main']
    is-main-branch: false
    pre-release-weight: 30000

ignore:
  sha: []