# GitVersion.yml
mode: ContinuousDelivery
assembly-versioning-scheme: MajorMinorPatch
tag-pre-release-weight: 60000
# The package id is new on nuget.org, but Automation.Velopack got to 1.0.11 on the private
# feed. Starting at 1.1.0 keeps the numbers moving forwards for anyone reading both.
next-version: 1.1.0
tag-prefix: '[vV]?'
branches:
  main:
    mode: ContinuousDeployment
    increment: Patch
    # Removed label for stable releases (no pre-release suffix)
    regex: ^master$|^main$
    is-main-branch: true
    track-merge-target: false
  feature:
    mode: ContinuousDelivery
    label: beta
    increment: Patch
    regex: ^feature(s)?[/-]
    source-branches: ['main']
    is-main-branch: false
    pre-release-weight: 30000
  bugfix:
    mode: ContinuousDelivery
    label: beta
    increment: Patch
    regex: ^bugfix(es)?[/-]
    source-branches: ['main']
    is-main-branch: false
    pre-release-weight: 30000

ignore:
  sha: []